<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BidDesk</title>
<meta name="description" content="Bid-invitation triage for commercial electrical contractors." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231B2430'/><path d='M6 16h6l3-7 4 14 3-7h4' fill='none' stroke='%23B87333' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="bar">
  <a class="brand" href="/" aria-label="BidDesk home">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#2A3644"/><path d="M6 16h6l3-7 4 14 3-7h4" fill="none" stroke="#B87333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    BidDesk
  </a>
  <nav aria-label="Main">
    <a href="/" aria-current="page">Estimating desk</a>
    <a href="/portal.html" target="_blank" rel="noopener">GC bid portal</a>
  </nav>
  <div class="spacer"></div>
  <div class="tally" id="tally"></div>
  <button class="iconbtn" id="bellBtn" aria-label="Notifications">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    <span class="dot" id="bellDot" hidden>0</span>
  </button>
  <button class="btn" id="logBtn">Log a bid email</button>
</header>

<div class="shell">
  <aside class="queue" aria-label="Bid queue">
    <div class="views" role="group" aria-label="Filter bids" id="views"></div>
    <div id="list"><div class="empty">Loading bids…</div></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<dialog id="logDialog" aria-labelledby="logTitle">
  <form method="dialog" id="logForm">
    <h2 id="logTitle">Log a bid email</h2>
    <div class="sub">For invitations that arrive by email. Paste it as received and the agents start right away.</div>
    <div class="examples" id="examples"><span>Try an example:</span></div>
    <label for="fFrom">From</label><input id="fFrom" placeholder="Dana Whitfield <dana@gc.com>" />
    <label for="fSubj">Subject</label><input id="fSubj" placeholder="ITB: Electrical, Framingham medical office" />
    <label for="fBody">Email</label><textarea id="fBody" placeholder="Paste the full email here"></textarea>
    <div class="err" id="fErr" hidden></div>
    <div class="dialog-actions">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn dark" id="logSubmit" value="default">Start analysis</button>
    </div>
  </form>
</dialog>

<div class="drawer" id="drawer" aria-label="Notifications">
  <header><b>Notifications</b><button class="btn" id="closeDrawer">Close</button></header>
  <div class="list" id="notes"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="/samples.js"></script>
<script src="/app.js"></script>
</body>
</html>
